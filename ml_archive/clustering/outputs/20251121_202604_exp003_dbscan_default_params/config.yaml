data_source:
  filters:
  - - bs_dt
    - ==
    - '2021-08-01'
  type: local_csv
drop_cols:
- company_id
- bs_dt
- fndt_dt
- listd_dt
- listd_abol_dt
evaluation:
  metrics:
  - Silhouette
experiment_name: exp003_dbscan_default_params
model:
  params:
    eps: 0.5
    min_samples: 5
  type: DBSCAN
paths:
  dump_path: !!python/object/apply:pathlib.PosixPath
  - /
  - Users
  - doonco
  - working
  - git-final
  - fintech-cb-pipeline
  - ml
  - clustering
  - data
  - dump
  - training_dataset_partitioned
  output_dir: /Users/doonco/working/git-final/fintech-cb-pipeline/ml/clustering/outputs/20251121_202604_exp003_dbscan_default_params
  processed_data_dir: data/processed
preprocessing:
- method: fillna
  params:
    strategy: median
- method: scale
  params:
    scaler: StandardScaler
target_col: perf_12m
