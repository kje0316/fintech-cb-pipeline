# Grafana Dashboards Provisioning
apiVersion: 1

providers:
  - name: 'Fintech CB Pipeline'
    orgId: 1
    folder: 'Fintech Monitoring'
    folderUid: 'fintech'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
