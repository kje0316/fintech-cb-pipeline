# financial_categories.yaml
# 5대 재무 카테고리 분류 정의

# 1. 안정성 (Stability): 부채, 유동성, 신용/연체 정보 (가장 중요)
Stability:
  # 부채 및 자본 관련 원본
  - FN1_14      # 유동부채
  - FN1_15      # 단기차입금
  - FN1_16      # 차입금
  - FN1_19      # 부채총계
  - FN1_20      # 자기자본
  - FN1_24      # 자본총계
  - FN3_11      # 순운전자본
  - FN3_11_1    # 순차입금
  # 안정성 비율
  - R006        # 부채비율
  - R007        # 자기자본비율
  - R008        # 유동비율
  - R012        # 차입금의존도
  - R009        # 당좌비율
  - N001        # 단기차입금의존도
  - N002        # 순차입금비율
  - N009        # 부채상환계수.1
  - FN3_3       # 부채상환계수
  - FN3_4       # 이자보상배율
  - FN3_10      # 청산가치율
  # 연체 및 신용 정보 (Risk Factors)
  - DA0D00021   # 연체과목수(미해제)
  - DA0D00026   # 연체과목수(1년내유지)
  - DA0D00029   # 연체과목수(1년내발생)
  - DA0D00033_1 # 최장연체일수(3개월)
  - DA0D00035_1 # 최장연체일수(1년)
  # - DB0D00006   # 30일이상연체(미해제)
  - D2B000012   # 국세체납(미해제)

# 2. 수익성 (Profitability): 이익 창출 능력
Profitability:
  # 손익계산서 원본
  - FN2_1       # 매출액
  - FN2_2_1     # 매출총이익
  - FN2_5       # 영업손익
  - FN2_10      # 당기순이익
  - FN3_7       # EBIT
  # 수익성 비율
  - R015        # 영업이익율
  - R016        # 당기순이익율
  - R013        # 매출원가율
  - R018        # ROE
  - R023        # 총자산순이익률
  - N004        # 자기자본순이익율
  - N005        # 매출총이익율

# 3. 활동성 (Activity): 자산 회전율 및 효율성
Activity:
  # 자산 원본
  - FN1_1       # 유동자산
  - FN1_4       # 재고자산
  - FN1_11      # 매출채권
  - FN1_13      # 자산총계
  # 활동성 비율
  - R019        # 매출채권회전율
  - R020        # 재고자산회전율
  - R021        # 매입채무회전율
  - R022        # 총자산회전율
  - N003        # 순운전자본회전율
  - N012        # 총자본회전율

# 4. 성장성 (Growth): 전년 대비 증가율
Growth:
  - R001        # 총자산증가율
  - R002        # 매출액증가율
  - R003        # 영업이익증가율
  - R004        # 당기순이익증가율
  - R024        # 유동자산증가율
  - R025        # 유형자산증가율
  - N007        # EBITDA증가율

# 5. 생산성 및 현금흐름 (Productivity & CashFlow): 현금 창출 및 질적 지표
Productivity:
  # 현금흐름표 원본
  - FN3_1       # 현금흐름
  - FN3_2       # 영업활동현금흐름
  - FN3_8       # EBITDA
  # 생산성 관련 비율
  - N006        # EBITDA마진율
  - N008        # OCF/매출액
  - N010        # 차입금/EBITDA
  - N011        # EBITDA/금융비용
  - FN3_6       # 적립금비율 