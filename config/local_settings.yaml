# config/local_settings.yaml (이 파일은 Git에 올라가지 않음!)

db:
  user: "kje"
  password: "" # 내 비밀번호
  host: "localhost"
  port: "5432"
  db_name: "fintech_cb_pipeline"

etl:
  source: "lake"  # "lake" 또는 "csv" - lake.raw_data 또는 CSV 파일에서 데이터 추출

paths:
  # (주의) 파이썬 스크립트가 실행되는 루트 폴더 기준의 상대 경로를 쓰는 것이 더 편리합니다.
  raw_data: "data/raw/기업신용평가정보_합성데이터.csv"
  industry_codes: "data/fake/industry_codes.csv"
  columns_map: "config/columns_map.yaml"

cleansing:
  derived_columns:
    enabled: true                # 파생컬럼 재계산 활성화 여부
    log_comparison: true         # 재계산 전후 비교 로그 출력
    comparison_threshold: 0.01   # 차이 감지 임계값 (절대값)

  leaf_outlier_removal:
    enabled: false               # ❌ DWH에서는 이상치 제거 안 함 (Mart에서 처리)
    method: "iqr"                # 방법: iqr 또는 zscore
    iqr_threshold: 1.5           # IQR 배수 (1.5=표준, 3.0=보수적, 1.0=공격적)
    target_columns:              # 대상 컬럼 (기본 재무항목 - Leaf columns)
      # 재무상태표 - 자산
      - FN1_13   # 자산총계
      - FN1_1    # 유동자산
      - FN1_2    # 비유동자산
      - FN1_3    # 당좌자산
      - FN1_4    # 재고자산
      - FN1_11   # 매출채권
      # 재무상태표 - 부채
      - FN1_19   # 부채총계
      - FN1_14   # 유동부채
      - FN1_18   # 비유동부채
      - FN1_16   # 차입금
      - FN1_15   # 단기차입금
      - FN1_17   # 매입채무
      # 재무상태표 - 자본
      - FN1_24   # 자본총계
      - FN1_22   # 이익잉여금
      # 손익계산서
      - FN2_1    # 매출액
      - FN2_2    # 매출원가
      - FN2_3    # 판매비와관리비
      - FN2_5    # 영업손익
      - FN2_10   # 당기순이익
      # 현금흐름
      - FN3_2    # 영업활동현금흐름

  outlier_removal:
    enabled: false               # ❌ DWH에서는 이상치 제거 안 함 (Mart에서 처리)
    method: "iqr"                # 방법: iqr 또는 zscore
    iqr_threshold: 1.5           # IQR 배수 (1.5=표준, 3.0=보수적, 1.0=공격적)
    target_columns:              # 대상 컬럼 (재무비율 33개 - R코드 21개 + N코드 12개)
      # R 코드 (21개)
      - R001  # 총자산증가율
      - R002  # 매출액증가율
      - R003  # 영업이익증가율
      - R004  # 당기순이익증가율
      - R006  # 부채비율
      - R007  # 자기자본비율
      - R008  # 유동비율
      - R009  # 당좌비율
      - R012  # 차입금의존도
      - R013  # 매출원가율
      - R014  # 판관비율
      - R015  # 영업이익율
      - R016  # 당기순이익율
      - R018  # 자기자본이익률(ROE)
      - R019  # 매출채권회전율
      - R020  # 재고자산회전율
      - R021  # 매입채무회전율
      - R022  # 총자산회전율
      - R023  # 총자산순이익률
      - R024  # 유동자산증가율
      - R025  # 유형자산증가율
      # N 코드 (12개)
      - N001  # 단기차입금의존도
      - N002  # 순차입금비율
      - N003  # 순운전자본회전율
      - N004  # 자기자본순이익율
      - N005  # 매출총이익율
      - N006  # EBITDA마진율
      - N007  # EBITDA증가율
      - N008  # OCF/매출액비용
      - N009  # 부채상환계수
      - N010  # 차입금/EBITDA
      - N011  # EBITDA/금융비용
      - N012  # 총자본회전율

# ============================================================
# Mart 적재 설정 (DWH → Mart)
# ============================================================
mart:
  # 결측치 대체 설정
  imputation:
    enabled: true                # 결측치 대체 활성화
    method: "industry_median"    # 대체 방법: industry_median, median, mean, zero
    target_columns:              # 대체 대상 컬럼 (Z-Score 계산에 필요한 7개)
      - FN1_13   # 총자산
      - FN1_19   # 부채총계
      - FN1_22   # 이익잉여금 (가장 많은 NULL)
      - FN1_24   # 자본총계
      - FN2_1    # 매출액
      - FN3_7    # EBIT
      - FN3_11   # 순운전자본
    add_imputation_flag: true    # 대체 여부 플래그 컬럼 추가 (예: fn1_22_imputed)

  # 이상치 처리 설정
  outlier_handling:
    enabled: true                # 이상치 처리 활성화
    method: "iqr"                # 방법: iqr, zscore, percentile
    iqr_threshold: 3.0           # IQR 배수 (3.0 = 보수적, Mart에서는 덜 공격적)
    action: "cap"                # 처리 방법: cap (상한/하한 제한), remove (제거), flag (플래그만)
    target_columns:              # 대상 컬럼
      - FN1_22   # 이익잉여금
      - FN2_10   # 당기순이익
      - R006     # 부채비율
      - R018     # ROE