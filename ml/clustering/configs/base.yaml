# 기본 경로 및 데이터 소스 설정
paths:
  # Feature Store 데이터를 Parquet 파티션으로 저장/로드할 디렉토리
  dump_path: 'data/dump/training_dataset_partitioned'
  # 각 실험별로 전처리된 데이터가 저장될 위치 (실행 시 동적으로 이름 생성)
  processed_data_dir: 'data/processed'
  # 최종 결과물이 저장될 기본 경로
  output_dir: 'outputs'

data_source:
  # feature_store 테이블을 우선 사용 (로컬 캐시가 없을 경우)
  type: 'local_csv' # 로컬 Parquet 캐시 사용을 의미

  filters: # 추가: 데이터 로딩 시 적용할 필터
    - ['bs_dt', '==', '2021-08-01']

# 데이터셋에서 제외할 컬럼
drop_cols:
  - 'company_id'
  - 'bs_dt'
  - 'fndt_dt'
  - 'listd_dt'
  - 'listd_abol_dt'
  
# 타겟 변수 (클러스터링에서는 직접 사용하지 않지만, 후속 분석을 위해 정의)
target_col: 'perf_12m'
